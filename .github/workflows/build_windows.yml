name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Enable Windows Desktop
      run: flutter config --enable-windows-desktop

    - name: Build Windows Executable
      run: flutter build windows

    - name: Bundle C++ Redistributable DLLs
      run: |
        Copy-Item "C:\Windows\System32\msvcp140.dll" -Destination "build\windows\x64\runner\Release\"
        Copy-Item "C:\Windows\System32\vcruntime140.dll" -Destination "build\windows\x64\runner\Release\"
        Copy-Item "C:\Windows\System32\vcruntime140_1.dll" -Destination "build\windows\x64\runner\Release\"

    - name: Compile Installer
      run: |
        choco install innosetup
        & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" windows/runner/installer.iss

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YellowPos-Windows
        path: windows/runner/Output/YellowPos_Setup.exe
